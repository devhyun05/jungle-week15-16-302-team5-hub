<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1300" viewBox="0 0 2200 1300">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fbff; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 52px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 500; fill: #475569; }
      .card { fill: #ffffff; stroke: #bae6fd; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .head { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 2; rx: 14; }
      .head-purple { fill: #f3e8ff; stroke: #c084fc; stroke-width: 2; rx: 14; }
      .table-name { font-family: Arial, Helvetica, sans-serif; font-size: 29px; font-weight: 800; letter-spacing: 1px; fill: #075985; }
      .table-name-purple { font-family: Arial, Helvetica, sans-serif; font-size: 29px; font-weight: 800; letter-spacing: 1px; fill: #6b21a8; }
      .field { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #334155; }
      .pk { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 800; fill: #0f766e; }
      .fk { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 800; fill: #7c3aed; }
      .rule { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #0f766e; }
      .line { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
      .label-bg { fill: #f8fbff; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 800; fill: #1e293b; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #9a3412; }
      .note-box { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; rx: 14; }
    </style>
  </defs>

  <rect class="bg" width="2200" height="1300"/>

  <text class="title" x="105" y="82">Malrang Lab Minimal Database ERD</text>
  <text class="subtitle" x="105" y="122">Embeddings are 1:N searchable chunks from posts or comments. MCP and Agent results are API responses only.</text>

  <path class="line" d="M540 302 H758"/>
  <rect class="label-bg" x="585" y="264" width="120" height="40"/>
  <text class="label" x="596" y="292">1:N writes</text>

  <path class="line" d="M325 420 V568"/>
  <rect class="label-bg" x="345" y="474" width="120" height="40"/>
  <text class="label" x="355" y="502">1:N writes</text>

  <path class="line" d="M758 510 C700 552 660 595 572 652"/>
  <rect class="label-bg" x="646" y="562" width="105" height="40"/>
  <text class="label" x="656" y="590">1:N has</text>

  <path class="line" d="M1322 458 C1435 505 1478 620 1528 675"/>
  <rect class="label-bg" x="1415" y="548" width="185" height="40"/>
  <text class="label" x="1425" y="576">1:N tagged</text>

  <path class="line" d="M1742 402 V568"/>
  <rect class="label-bg" x="1762" y="466" width="155" height="40"/>
  <text class="label" x="1772" y="494">1:N assigned</text>

  <path class="line" d="M970 652 V778"/>
  <rect class="label-bg" x="995" y="704" width="170" height="40"/>
  <text class="label" x="1005" y="732">1:N chunks</text>

  <path class="line" d="M572 765 C645 815 694 888 758 940"/>
  <rect class="label-bg" x="612" y="836" width="170" height="40"/>
  <text class="label" x="622" y="864">1:N chunks</text>

  <g>
    <rect class="card" x="105" y="170" width="435" height="250"/>
    <rect class="head" x="105" y="170" width="435" height="58"/>
    <text class="table-name" x="132" y="209">USERS</text>
    <text class="pk" x="132" y="268">PK</text><text class="field" x="174" y="268">id bigint</text>
    <text class="field" x="132" y="302">email varchar(255) unique</text>
    <text class="field" x="132" y="336">password_hash varchar(255)</text>
    <text class="field" x="132" y="370">nickname varchar(80)</text>
    <text class="field" x="132" y="404">created_at, updated_at</text>
  </g>

  <g>
    <rect class="card" x="760" y="130" width="562" height="522"/>
    <rect class="head" x="760" y="130" width="562" height="58"/>
    <text class="table-name" x="788" y="169">POSTS</text>
    <text class="pk" x="788" y="228">PK</text><text class="field" x="830" y="228">id bigint</text>
    <text class="fk" x="788" y="262">FK</text><text class="field" x="830" y="262">user_id -&gt; users.id</text>
    <text class="field" x="788" y="296">title varchar(200), content text</text>
    <text class="field" x="788" y="330">post_type varchar(20)</text>
    <text class="field" x="788" y="364">slime_type, difficulty</text>
    <text class="field" x="788" y="398">ingredients, ratio, steps</text>
    <text class="field" x="788" y="432">texture_result, storage_tip</text>
    <text class="field" x="788" y="466">symptom, attempted_solution</text>
    <text class="field" x="788" y="500">solved_status varchar(40)</text>
    <text class="field" x="788" y="534">created_at, updated_at</text>
    <rect x="788" y="574" width="372" height="36" rx="13" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text class="rule" x="808" y="598">recipe | failure | review | general</text>
  </g>

  <g>
    <rect class="card" x="1530" y="170" width="420" height="232"/>
    <rect class="head" x="1530" y="170" width="420" height="58"/>
    <text class="table-name" x="1558" y="209">TAGS</text>
    <text class="pk" x="1558" y="268">PK</text><text class="field" x="1600" y="268">id bigint</text>
    <text class="field" x="1558" y="302">name varchar(80)</text>
    <text class="field" x="1558" y="336">tag_type varchar(40)</text>
    <text class="field" x="1558" y="370">unique(name, tag_type)</text>
  </g>

  <g>
    <rect class="card" x="105" y="570" width="467" height="270"/>
    <rect class="head" x="105" y="570" width="467" height="58"/>
    <text class="table-name" x="132" y="609">COMMENTS</text>
    <text class="pk" x="132" y="668">PK</text><text class="field" x="174" y="668">id bigint</text>
    <text class="fk" x="132" y="702">FK</text><text class="field" x="174" y="702">post_id -&gt; posts.id</text>
    <text class="fk" x="132" y="736">FK</text><text class="field" x="174" y="736">user_id -&gt; users.id</text>
    <text class="field" x="132" y="770">content text</text>
    <text class="field" x="132" y="804">created_at, updated_at</text>
  </g>

  <g>
    <rect class="card" x="1530" y="570" width="430" height="230"/>
    <rect class="head" x="1530" y="570" width="430" height="58"/>
    <text class="table-name" x="1558" y="609">POST_TAGS</text>
    <text class="pk" x="1558" y="668">PK/FK</text><text class="field" x="1636" y="668">post_id -&gt; posts.id</text>
    <text class="pk" x="1558" y="702">PK/FK</text><text class="field" x="1636" y="702">tag_id -&gt; tags.id</text>
    <text class="field" x="1558" y="736">created_at</text>
    <text class="field" x="1558" y="770">composite primary key</text>
  </g>

  <g>
    <rect class="card" x="760" y="780" width="620" height="370"/>
    <rect class="head-purple" x="760" y="780" width="620" height="58"/>
    <text class="table-name-purple" x="788" y="819">EMBEDDINGS</text>
    <text class="pk" x="788" y="878">PK</text><text class="field" x="830" y="878">id bigint</text>
    <text class="field" x="788" y="912">source_type post | comment</text>
    <text class="fk" x="788" y="946">FK</text><text class="field" x="830" y="946">post_id -&gt; posts.id nullable</text>
    <text class="fk" x="788" y="980">FK</text><text class="field" x="830" y="980">comment_id -&gt; comments.id nullable</text>
    <text class="field" x="788" y="1014">content text</text>
    <text class="field" x="788" y="1048">embedding vector(1536)</text>
    <text class="field" x="788" y="1082">embedding_model, embedding_dim</text>
    <text class="field" x="788" y="1116">content_hash, created_at, updated_at</text>
    <rect x="788" y="1130" width="510" height="34" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <text class="rule" x="806" y="1154">XOR: exactly one of post_id or comment_id</text>
  </g>

  <rect class="note-box" x="530" y="1210" width="1140" height="60"/>
  <text class="note" x="558" y="1248">Embedding relation: posts 1:N embeddings, comments 1:N embeddings. Each embedding row has one source only.</text>
</svg>
